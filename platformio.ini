[platformio]
default_envs = gps_native_usb

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit SSD1306@2.5.13
    mikalhart/TinyGPSPlus@1.0.3

; Build baseline for ESP32-S3. USB CDC is enabled for native USB debug.
; The Super Mini variant can differ; verify exposed pins and flash/PSRAM first.
[env:gps_native_usb]
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; GPS uses UART1; SIM800L uses UART2. USB CDC remains the debug console.
